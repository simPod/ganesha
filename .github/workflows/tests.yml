name: Tests

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  phpunit:
    name: Tests
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:6
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
      memcached:
        image: memcached:1.6.5
        ports:
          - 11211:11211
      mongodb:
        image: mongo
        ports:
          - 27017:27017
    strategy:
      fail-fast: false
      matrix:
        php-version:
          - "8.5"
        dependency-versions:
          - highest
          - lowest
    steps:
      - uses: actions/checkout@v4

      # https://github.com/shivammathur/setup-php
      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer
          # Specific versions of extensions available on PECL can be set up by suffixing the extension's name with the version.
          # https://github.com/shivammathur/setup-php?tab=readme-ov-file#heavy_plus_sign-php-extension-support
          extensions: >-
            apcu, redis-6.3.0, memcached-3.4.0, mongodb-2.5.7
          ini-values: apc.enable_cli=1
          coverage: xdebug
        env:
          fail-fast: true

      - name: Update dependencies with composer
        uses: ramsey/composer-install@4.0.0
        with:
          dependency-versions: ${{ matrix.dependency-versions }}

      - name: Run tests with PHPUnit
        run: vendor/bin/phpunit

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: phpunit-${{ matrix.php-version }}-${{ matrix.dependency-versions }}.coverage
          path: build/logs/clover.xml
          if-no-files-found: error

  upload-coverage:
    name: Upload coverage to Codecov
    runs-on: ubuntu-latest
    needs: phpunit
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download coverage reports
        uses: actions/download-artifact@v4
        with:
          path: reports
          pattern: phpunit-*.coverage
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: reports/phpunit-8.5-highest.coverage/clover.xml,reports/phpunit-8.5-lowest.coverage/clover.xml
          disable_search: true
          fail_ci_if_error: true
